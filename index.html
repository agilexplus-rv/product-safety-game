<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Safety Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg1: #0f1b3d; --bg2: #1e3a6e;
    --card: #ffffff; --ink: #17243d; --muted: #5b6b85;
    --accent: #ff5d73; --accent2: #21c07a; --gold: #ffb300;
  }
  body {
    font-family: 'Segoe UI', 'Trebuchet MS', system-ui, sans-serif;
    min-height: 100vh; color: #fff;
    background: linear-gradient(160deg, var(--bg1), var(--bg2) 60%, #2b5fa8);
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px 40px;
  }
  .lang { display: flex; gap: 6px; align-self: flex-end; }
  .lang button {
    border: 2px solid rgba(255,255,255,.5); background: rgba(255,255,255,.08);
    color: #fff; font-weight: 700; padding: 7px 14px; border-radius: 20px;
    cursor: pointer; font-size: 14px;
  }
  .lang button.active { background: #fff; color: var(--ink); border-color: #fff; }
  header { text-align: center; margin: 18px 0 8px; }
  header .shield { font-size: 64px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
  h1 { font-size: clamp(26px, 5vw, 44px); letter-spacing: .5px; margin-top: 6px; }
  .tagline { color: #cfe0ff; margin-top: 8px; font-size: clamp(14px, 2.4vw, 18px); max-width: 640px; }
  .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; margin-top: 36px; width: 100%; max-width: 980px; }
  .card {
    background: var(--card); color: var(--ink); border-radius: 22px;
    width: min(440px, 100%); padding: 26px 26px 24px; text-decoration: none;
    box-shadow: 0 14px 40px rgba(0,0,0,.35);
    transition: transform .15s ease, box-shadow .15s ease;
    display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;
  }
  .card:hover { transform: translateY(-6px) scale(1.01); box-shadow: 0 22px 50px rgba(0,0,0,.45); }
  .card .art { font-size: 58px; line-height: 1; }
  .card h2 { font-size: 24px; }
  .card p { color: var(--muted); font-size: 15px; line-height: 1.45; }
  .age { position: absolute; top: 18px; right: 18px; background: var(--gold); color: #4a3200;
    font-weight: 800; font-size: 13px; padding: 6px 12px; border-radius: 14px; }
  .cta { margin-top: auto; align-self: flex-start; font-weight: 800; color: #fff;
    padding: 12px 22px; border-radius: 14px; font-size: 16px; }
  .card.kids .cta { background: var(--accent); }
  .card.older .cta { background: var(--accent2); }
  .card.kids { border-top: 8px solid var(--accent); }
  .card.older { border-top: 8px solid var(--accent2); }
  footer { margin-top: 44px; max-width: 760px; text-align: center; color: #b9cdf2; font-size: 13px; line-height: 1.6; }
  footer a { color: #fff; }
</style>
</head>
<body>
  <div class="lang">
    <button data-lang-btn="en">EN</button>
    <button data-lang-btn="mt">MT</button>
  </div>

  <header>
    <div class="shield">🛡️</div>
    <h1 data-i18n="title">Product Safety Games</h1>
    <div class="tagline" data-i18n="tagline"></div>
  </header>

  <div class="cards">
    <a class="card kids" href="game1/">
      <span class="age" data-i18n="age1">Ages 4–6</span>
      <div class="art">🧸⭐</div>
      <h2 data-i18n="g1name">Safety Stars</h2>
      <p data-i18n="g1desc"></p>
      <span class="cta" data-i18n="play">Play!</span>
    </a>
    <a class="card older" href="game2/">
      <span class="age" data-i18n="age2">Ages 8–12</span>
      <div class="art">🕵️🔎</div>
      <h2 data-i18n="g2name">Safety Detective</h2>
      <p data-i18n="g2desc"></p>
      <span class="cta" data-i18n="play2">Play!</span>
    </a>
  </div>

  <footer>
    <p data-i18n="footer1"></p>
    <p style="margin-top:8px" data-i18n="footer2"></p>
  </footer>

<script src="shared/i18n.js"></script>
<script>
  var STRINGS = {
    en: {
      title: 'Product Safety Games',
      tagline: 'Learn to spot unsafe products, read safety labels and check for recalls — by playing!',
      age1: 'Ages 4–6', age2: 'Ages 8–12',
      g1name: 'Safety Stars',
      g1desc: 'Help Ziggy the Safety Star find dangers at home, sort the toys and catch the safe ones. No reading needed — just tap and play!',
      g2name: 'Safety Detective',
      g2desc: 'Walk through a 3D house, inspect real products for CE marks and warning labels, scan the EU Safety Gate for recalls, and outsmart dodgy online shops.',
      play: 'Play!', play2: 'Play!',
      footer1: 'An educational project about consumer product safety — the things we buy in shops and online.',
      footer2: 'Inspired by the EU Safety Gate rapid alert system and the work of the MCCAA (Malta Competition and Consumer Affairs Authority).'
    },
    mt: {
      title: 'Logħob dwar is-Sigurtà tal-Prodotti',
      tagline: 'Tgħallem agħraf prodotti perikolużi, aqra t-tikketti tas-sigurtà u ċċekkja għal sejħiet lura — waqt li tilgħab!',
      age1: 'Età 4–6', age2: 'Età 8–12',
      g1name: 'Stilel tas-Sigurtà',
      g1desc: 'Għin lil Ziggy l-Istilla tas-Sigurtà ssib il-perikli d-dar, issortja l-ġugarelli u taqbad dawk sikuri. M’hemmx bżonn taqra — għafas u ilgħab!',
      g2name: 'Ditektif tas-Sigurtà',
      g2desc: 'Imxi f’dar 3D, spezzjona prodotti għall-marka CE u t-tikketti ta’ twissija, skennja s-Safety Gate tal-UE għal sejħiet lura, u egħleb il-ħwienet online suspettużi.',
      play: 'Ilgħab!', play2: 'Ilgħab!',
      footer1: 'Proġett edukattiv dwar is-sigurtà tal-prodotti tal-konsumatur — l-affarijiet li nixtru mill-ħwienet u online.',
      footer2: 'Ispirat mis-sistema Safety Gate tal-UE u mill-ħidma tal-MCCAA (l-Awtorità ta’ Malta għall-Kompetizzjoni u għall-Affarijiet tal-Konsumatur).'
    }
  };
  PSG.applyStatic(STRINGS);
</script>
</body>
</html>
